syntax = "proto3";

package servicios;
option go_package = "/serviciosCancion";

service AudioService {
  // Streaming de canción
  rpc enviarCancionMedianteStream(peticionDTO) returns (stream fragmentoCancion);
}

message peticionDTO {
  string titulo = 1;
  string formato = 2;
  string id_usuario = 3; // usuario que reproduce (para el servidor de estadísticas)
  string tipo = 4;       // musica, audioLibros, podcast o ruidoBlanco
}

message fragmentoCancion {
  bytes data = 1; // Fragmento de audio
}
